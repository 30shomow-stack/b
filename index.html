<html>
  <head>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
  </head>
  <body>
	<a-scene>
	<a-sky color="#ECECEC"></a-sky>
	<a-camera position="-4 10 -20"></a-camera>
	<!-- Load Assets -->
		<a-assets>
			<a-asset-item id="index" src="index.glb"><a-a-asset-item>
		</a-assets>

	<!-- Display Assets -->
	<a-entity gltf-model="#index" animation-mixer><a-entity>
</a-scene>
  </body>
</html>
